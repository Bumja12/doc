<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI-006: 스플래시 및 로딩</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css">
    <style>
        .splash-screen {
            background-color: var(--c-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .splash-logo {
            width: 100px;
            height: 100px;
            background-color: var(--c-white);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--c-primary);
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .splash-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--c-white);
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid var(--c-white);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--c-white);
            font-size: 14px;
            font-weight: 600;
            opacity: 0.9;
        }

    </style>
</head>
<body>

    <div class="device-wrapper">
        <div class="device-frame">
            <div class="status-bar" style="color: var(--c-white);">
                <span>09:41</span>
                <div class="status-icons"><span>📶</span><span>🔋</span></div>
            </div>

            <div class="screen-content splash-screen">
                <div class="splash-logo">A</div>
                <div class="splash-title">우리 동네</div>
                
                <div class="loader"></div>
                <div class="loading-text">최적화 중... (35%)</div>
            </div>
        </div>
    </div>

</body>
</html>
