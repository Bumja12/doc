<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI-014: 전체화면 사이드 메뉴 (Galaxy S25 Ultra)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css">
    <style>
        /* Menu Container */
        .menu-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
        }

        .section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--c-text-sub);
            padding: 0 24px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Menu Items */
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .menu-item:active {
            background-color: var(--c-bg);
        }

        .menu-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--c-text-main);
        }

        /* Sub Menu specific styles */
        .menu-item.sub-menu {
            padding-left: 48px; /* Indentation */
        }

        .menu-item.sub-menu .menu-text {
            font-size: 15px;
            font-weight: 400;
            position: relative;
        }

        /* L-shape tree line for sub-menus */
        .menu-item.sub-menu .menu-text::before {
            content: '';
            position: absolute;
            left: -16px;
            top: -12px;
            width: 10px;
            height: 20px;
            border-left: 2px solid var(--c-border);
            border-bottom: 2px solid var(--c-border);
        }

        /* Star Icon */
        .star-icon {
            font-size: 18px;
            cursor: pointer;
            user-select: none;
        }

        .star-active {
            color: var(--c-star-active);
        }

        .star-inactive {
            color: var(--c-star-inactive);
        }

    </style>
</head>
<body>

    <div class="device-wrapper" style="padding: 40px; display: inline-block;">
        <div class="device-frame">
            <!-- iOS/Android Status Bar Simulation -->
            <div class="status-bar">
                <span>11:52</span>
                <div class="status-icons">
                    <span>📶</span>
                    <span>🔋</span>
                </div>
            </div>

            <!-- App Header -->
            <div class="header">
                <button class="btn-close">✕</button>
                <div class="header-title">메뉴</div>
                <div class="header-placeholder"></div>
            </div>

            <!-- Menu Content -->
            <div class="menu-container">
                
                <!-- Section 1: Favorites -->
                <div class="section">
                    <div class="section-title">
                        <span style="color: var(--c-star-active)">★</span> 즐겨찾는 메뉴
                    </div>
                    
                    <div class="menu-item">
                        <span class="menu-text">자유게시판 (NEW!)</span>
                        <span class="star-icon star-active">★</span>
                    </div>
                    <div class="menu-item">
                        <span class="menu-text">동네 중고거래 (Hot)</span>
                        <span class="star-icon star-active">★</span>
                    </div>
                </div>

                <!-- Section 2: All Menus -->
                <div class="section">
                    <div class="section-title">
                        <span>≡</span> 전체 메뉴
                    </div>
                    
                    <!-- Main Menu 1 -->
                    <div class="menu-item">
                        <span class="menu-text">커뮤니티</span>
                        <span class="star-icon star-active">★</span>
                    </div>
                    <!-- Sub Menus -->
                    <div class="menu-item sub-menu">
                        <span class="menu-text">자유게시판</span>
                        <span class="star-icon star-active">★</span>
                    </div>
                    <div class="menu-item sub-menu">
                        <span class="menu-text">아파트 모임</span>
                        <span class="star-icon star-inactive">☆</span>
                    </div>

                    <!-- Main Menu 2 -->
                    <div class="menu-item" style="margin-top: 8px;">
                        <span class="menu-text">거래/나눔</span>
                        <span class="star-icon star-active">★</span>
                    </div>
                    <!-- Sub Menus -->
                    <div class="menu-item sub-menu">
                        <span class="menu-text">동네 중고거래</span>
                        <span class="star-icon star-active">★</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
