<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI-013: 서버 점검 공지</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css">
    <style>
        .maintenance-screen {
            background-color: var(--c-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .m-icon {
            font-size: 80px;
            margin-bottom: 24px;
        }

        .m-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--c-text-main);
            margin-bottom: 16px;
        }

        .m-desc {
            font-size: 15px;
            color: var(--c-text-sub);
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .info-box {
            background-color: var(--c-bg);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            text-align: left;
            margin-bottom: 40px;
        }

        .info-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-size: 13px;
            color: var(--c-text-sub);
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--c-text-main);
            line-height: 1.4;
        }

        .btn-container {
            width: 100%;
            margin-top: auto;
            margin-bottom: 24px;
        }

    </style>
</head>
<body>

    <div class="device-wrapper">
        <div class="device-frame">
            <div class="status-bar">
                <span>09:41</span>
                <div class="status-icons"><span>📶</span><span>🔋</span></div>
            </div>

            <div class="screen-content maintenance-screen">
                <div style="flex: 1;"></div>

                <div class="m-icon">🛠️</div>
                <div class="m-title">시스템 점검 안내</div>
                <div class="m-desc">
                    보다 안정적인 서비스를 제공하기 위해<br>현재 시스템 점검을 진행하고 있습니다.<br>이용에 불편을 드려 대단히 죄송합니다.
                </div>

                <div class="info-box">
                    <div class="info-row">
                        <span class="info-label">점검 일시</span>
                        <span class="info-value">2026. 06. 10 (수)<br>02:00 ~ 06:00 (4시간)</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">점검 내용</span>
                        <span class="info-value">DB 서버 안정화 및 인프라 교체</span>
                    </div>
                </div>

                <div style="flex: 1;"></div>

                <div class="btn-container">
                    <button class="btn-primary">앱 종료</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
